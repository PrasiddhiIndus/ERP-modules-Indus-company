# Production nginx cache rules for Vite SPA (indus-erp.in).
# Merge these `location` blocks into the existing server { ... } for
#   root /var/www/indus-erp/dist;
# then: nginx -t && systemctl reload nginx
#
# Why: browsers were caching index.html after deploys, then requesting old
# hashed /assets/*.js files that no longer exist → "Page update required".

    # API proxy — REQUIRED on production.
    # Without client_max_body_size, nginx defaults to 1m and returns 413 for:
    #   - recruitment / employee portal document uploads
    #   - exit-email PDF payloads
    #   - other /api/ multipart or large JSON posts
    # Match the Node listen port used by production (often 8787).
    # location /api/ {
    #     client_max_body_size 35m;
    #     proxy_pass http://127.0.0.1:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Hashed Vite build files — long cache is correct
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entry — never long-cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }

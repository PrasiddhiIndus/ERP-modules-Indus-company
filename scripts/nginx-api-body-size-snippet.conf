# Production / staging: raise nginx body limit for /api/.
# Without this, nginx defaults to 1m and returns HTTP 413 for:
#   - /api/recruitment-portal/:token/upload (candidate document uploads)
#   - /api/employee-document-portal/:token/upload
#   - exit-document email PDF payloads (base64 JSON)
#   - other large multipart / JSON API posts
#
# Add inside the server block that proxies /api/ (or inside location /api/), then:
#   sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 35m;

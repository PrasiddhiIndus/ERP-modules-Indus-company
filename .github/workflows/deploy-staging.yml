name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security check
        run: npm run security-check

      - name: Smoke tests
        run: npm run test:smoke

  deploy:
    name: Deploy Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            # No `-x`: tracing expands secret assignments into the Actions log.
            set -euo pipefail
            REPO_DIR=/root/indus-erp-staging
            # The repo is private, so anonymous HTTPS fetch fails. Auth comes from a
            # read-only Deploy key held by this droplet (~/.ssh/id_ed25519).
            REPO_URL="git@github.com:PrasiddhiIndus/ERP-modules-Indus-company.git"

            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
            # Refresh GitHub host keys every run so a stale entry can never block the fetch.
            ssh-keygen -R github.com >/dev/null 2>&1 || true
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            if ! git ls-remote "${REPO_URL}" >/dev/null 2>&1; then
              echo "ERROR: this droplet cannot read the private repository."
              echo "One-time fix on the server:"
              echo "  ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N '' -C indus-erp-deploy"
              echo "  cat ~/.ssh/id_ed25519.pub"
              echo "Then GitHub -> Settings -> Deploy keys -> Add deploy key (write access OFF)."
              exit 1
            fi

            # One-time: create the staging checkout if this droplet does not have it yet.
            if [ ! -d "${REPO_DIR}/.git" ]; then
              echo "==> Cloning staging repo into ${REPO_DIR}"
              rm -rf "${REPO_DIR}"
              git clone --branch staging "${REPO_URL}" "${REPO_DIR}"
            fi

            cd "${REPO_DIR}"
            git remote set-url origin "${REPO_URL}" || true
            git fetch origin staging
            git checkout -B staging origin/staging
            git reset --hard origin/staging

            # Run the repo copy so the server script can never go stale again.
            bash scripts/deploy-staging.sh

            cp scripts/deploy-staging.sh /root/deploy-staging.sh
            chmod +x /root/deploy-staging.sh

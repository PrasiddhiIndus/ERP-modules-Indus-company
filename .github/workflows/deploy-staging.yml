name: Deploy Staging

# Staging = code quality gate + preview deploy against the ONE production Supabase DB.
# No separate staging database / STAGING_SUPABASE_* secrets.
# Failures here must be real lint/security/smoke/build errors before merge to main.

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security check
        run: npm run security-check

      - name: Smoke tests
        run: npm run test:smoke

      # Compile check only — placeholders, no DB secrets required.
      - name: Build verify (no staging DB)
        run: |
          npm run build
          test -f dist/index.html
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          VITE_EINVOICE_PROVIDER: backend
          VITE_EINVOICE_API_URL: /api/billing/e-invoice

  deploy:
    name: Deploy Staging
    needs: build
    runs-on: ubuntu-latest
    # Preview host on the droplet. Uses the same production VITE_* secrets (one DB).
    # Never injects PROD_SUPABASE_SERVICE_ROLE_KEY here — keep that on main / production only.
    environment:
      name: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Built here, not on the droplet, where Vite gets OOM-killed (exit 137).
      # Same production Supabase project as main — staging DB removed.
      - name: Build Frontend (production DB)
        run: |
          test -n "${VITE_SUPABASE_URL}" || { echo "ERROR: secret VITE_SUPABASE_URL is empty"; exit 1; }
          test -n "${VITE_SUPABASE_ANON_KEY}" || { echo "ERROR: secret VITE_SUPABASE_ANON_KEY is empty"; exit 1; }
          case "${VITE_SUPABASE_URL}" in
            *xjzhlbpgnpcmbdlufhwo*)
              echo "ERROR: staging DB project is retired — use production VITE_SUPABASE_URL (wbyzhknaqcjqqtwopupl)"
              exit 1
              ;;
          esac
          npm run build
          test -f dist/index.html
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EINVOICE_PROVIDER: backend
          VITE_EINVOICE_API_URL: /api/billing/e-invoice

      - name: Package staging build
        run: tar -czf dist-staging.tar.gz -C dist .

      - name: Copy staging build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: dist-staging.tar.gz
          target: /tmp/indus-erp-staging-build

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: PROD_SUPABASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY
          script: |
            # No `-x`: tracing expands secret assignments into the Actions log.
            set -euo pipefail
            # Staging checkout on the droplet. nginx serves ${REPO_DIR}/dist directly,
            # so the CI build is unpacked there — there is no separate rsync target.
            REPO_DIR=/var/www/indus-erp-staging
            PM2_NAME=indus-erp-staging
            # The repo is private, so anonymous HTTPS fetch fails. Auth comes from a
            # read-only Deploy key held by this droplet (~/.ssh/id_ed25519).
            REPO_URL="git@github.com:PrasiddhiIndus/ERP-modules-Indus-company.git"
            PRODUCTION_SUPABASE_URL="${PROD_SUPABASE_URL:-https://wbyzhknaqcjqqtwopupl.supabase.co}"

            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
            # Refresh GitHub host keys every run so a stale entry can never block the fetch.
            ssh-keygen -R github.com >/dev/null 2>&1 || true
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            if ! git ls-remote "${REPO_URL}" >/dev/null 2>&1; then
              echo "ERROR: this droplet cannot read the private repository."
              echo "One-time fix on the server:"
              echo "  ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N '' -C indus-erp-deploy"
              echo "  cat ~/.ssh/id_ed25519.pub"
              echo "Then GitHub -> Settings -> Deploy keys -> Add deploy key (write access OFF)."
              exit 1
            fi

            if [ ! -d "${REPO_DIR}/.git" ]; then
              echo "ERROR: ${REPO_DIR} is not a git checkout on this droplet."
              echo "Staging is expected to live there (nginx serves ${REPO_DIR}/dist)."
              exit 1
            fi

            cd "${REPO_DIR}"
            # Existing checkouts still point at the old public HTTPS URL, which now 401s.
            git remote set-url origin "${REPO_URL}"
            git fetch origin staging
            git reset --hard origin/staging

            # Server-side deps are still needed for the PM2 API process.
            npm ci

            # The frontend was built on the CI runner and scp'd here. Building it on this
            # droplet is what got OOM-killed, so only fall back if the artifact is missing.
            if [ -f /tmp/indus-erp-staging-build/dist-staging.tar.gz ]; then
              echo "==> Using frontend built by CI"
              rm -rf dist && mkdir -p dist
              tar -xzf /tmp/indus-erp-staging-build/dist-staging.tar.gz -C dist
            else
              echo "WARNING: no CI build found — falling back to building on the server"
              NODE_OPTIONS="--max-old-space-size=${NODE_HEAP_MB:-2048}" npm run build
            fi
            test -f dist/index.html
            rm -rf /tmp/indus-erp-staging-build

            # One production DB only. Drop retired staging-env pin so auto-pin can use production.
            if [ -f .env.server ]; then
              sed -i '/^ERP_ENV=/d' .env.server || true
              sed -i '/^SUPABASE_URL=/d' .env.server || true
              echo "SUPABASE_URL=${PRODUCTION_SUPABASE_URL}" >> .env.server

              # Production API is 8787 on this droplet. Staging preview API stays on 4001.
              sed -i '/^SERVER_PORT=/d' .env.server || true
              sed -i '/^PORT=/d' .env.server || true
              echo "SERVER_PORT=4001" >> .env.server
              echo "PORT=4001" >> .env.server
            fi

            # Frontend env on host (optional local rebuilds) — production project only.
            if [ -n "${VITE_SUPABASE_URL:-}" ] && [ -n "${VITE_SUPABASE_ANON_KEY:-}" ]; then
              printf '%s\n' \
                "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" \
                "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}" \
                "VITE_EINVOICE_PROVIDER=backend" \
                "VITE_EINVOICE_API_URL=/api/billing/e-invoice" \
                > .env.production
            fi

            pm2 restart "${PM2_NAME}" --update-env
            pm2 save
            systemctl reload nginx
            echo "==> Staging deploy complete (${REPO_DIR}/dist) — production Supabase only"
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

# Production nginx cache rules for Vite SPA (indus-erp.in).
# Merge these `location` blocks into the existing server { ... } for
#   root /var/www/indus-erp/dist;
# then: nginx -t && systemctl reload nginx
#
# Why: browsers were caching index.html after deploys, then requesting old
# hashed /assets/*.js files that no longer exist → "Page update required".

    # API proxy — allow exit-email PDF payloads (default nginx limit is 1m → 413).
    # Put this on the same server block that proxies /api/ to Node, then reload nginx.
    # location /api/ {
    #     client_max_body_size 20m;
    #     proxy_pass http://127.0.0.1:4000;
    #     ...
    # }

    # Hashed Vite build files — long cache is correct
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entry — never long-cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }

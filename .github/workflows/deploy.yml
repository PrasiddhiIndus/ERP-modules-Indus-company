name: Indus ERP CI/CD

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security check
        run: npm run security-check

      - name: Smoke tests
        run: npm run test:smoke

      - name: Build Project (staging)
        if: github.ref == 'refs/heads/staging' || (github.event_name == 'pull_request' && github.base_ref == 'staging')
        run: npm run build:staging
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_EINVOICE_PROVIDER: backend
          VITE_EINVOICE_API_URL: /api/billing/e-invoice

      - name: Build Project (production)
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EINVOICE_PROVIDER: backend
          VITE_EINVOICE_API_URL: /api/billing/e-invoice

  deploy-production:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: PROD_SUPABASE_URL,PROD_SUPABASE_SERVICE_ROLE_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY
          script: |
            # No `-x`: tracing expands secret assignments into the Actions log.
            set -euo pipefail
            REPO_DIR=/root/indus-erp
            # Must match nginx sites-available/indus-erp: root /var/www/indus-erp/dist;
            APP_DIR=/var/www/indus-erp/dist
            # The repo is private, so anonymous HTTPS fetch fails. Auth comes from a
            # read-only Deploy key held by this droplet (~/.ssh/id_ed25519).
            REPO_URL="git@github.com:PrasiddhiIndus/ERP-modules-Indus-company.git"

            echo "==> host=$(hostname)"

            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            if ! grep -q '^github.com ' ~/.ssh/known_hosts 2>/dev/null; then
              ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            fi

            if ! git ls-remote "${REPO_URL}" >/dev/null 2>&1; then
              echo "ERROR: this droplet cannot read the private repository."
              echo "One-time fix on the server:"
              echo "  ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N '' -C indus-erp-deploy"
              echo "  cat ~/.ssh/id_ed25519.pub"
              echo "Then GitHub -> Settings -> Deploy keys -> Add deploy key (paste it, leave write access OFF)."
              exit 1
            fi

            # One-time: create git checkout used by deploy (static site stays in APP_DIR)
            if [ ! -d "${REPO_DIR}/.git" ]; then
              echo "==> Cloning production repo into ${REPO_DIR}"
              rm -rf "${REPO_DIR}"
              git clone --branch main --depth 1 "${REPO_URL}" "${REPO_DIR}"
            fi

            cd "${REPO_DIR}"
            git remote set-url origin "${REPO_URL}" || true
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            # Keep server secrets if they already exist beside legacy scripts
            if [ ! -f .env.server ] && [ -f /root/indus-erp-env/.env.server ]; then
              cp /root/indus-erp-env/.env.server .env.server
            fi
            if [ ! -f .env.server ] && [ -f /root/.env.server ]; then
              cp /root/.env.server .env.server
            fi
            if [ ! -f .env.server ] && [ -f .env.server.example ]; then
              cp .env.server.example .env.server
            fi

            # Frontend build env (Vite) — prefer CI secrets when present
            if [ -n "${VITE_SUPABASE_URL:-}" ] && [ -n "${VITE_SUPABASE_ANON_KEY:-}" ]; then
              printf '%s\n' \
                "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" \
                "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}" \
                "VITE_EINVOICE_PROVIDER=backend" \
                "VITE_EINVOICE_API_URL=/api/billing/e-invoice" \
                > .env.production
            fi

            # Force production Supabase secrets onto .env.server before deploy.sh
            # (appleboy passes these via `envs:` — empty secret must not wipe a good local key)
            if [ -n "${PROD_SUPABASE_URL:-}" ]; then
              sed -i '/^SUPABASE_URL=/d' .env.server || true
              echo "SUPABASE_URL=${PROD_SUPABASE_URL}" >> .env.server
            else
              sed -i '/^SUPABASE_URL=/d' .env.server || true
              echo "SUPABASE_URL=https://wbyzhknaqcjqqtwopupl.supabase.co" >> .env.server
            fi
            # Only the CI secret may write this key. An empty secret leaves the
            # existing server value untouched — never seeded from a committed template.
            if [ -n "${PROD_SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              sed -i '/^SUPABASE_SERVICE_ROLE_KEY=/d' .env.server || true
              echo "SUPABASE_SERVICE_ROLE_KEY=${PROD_SUPABASE_SERVICE_ROLE_KEY}" >> .env.server
            else
              echo "WARNING: PROD_SUPABASE_SERVICE_ROLE_KEY secret is empty — keeping existing .env.server value"
            fi

            # Ensure .env.server exists even if the copy steps above were skipped
            if [ ! -f .env.server ]; then
              cp .env.server.example .env.server
              echo "WARNING: .env.server created from placeholders — set real secrets on the host"
            fi

            # Production runtime flags (strict CORS, quiet health, debug routes 404)
            sed -i '/^NODE_ENV=/d' .env.server || true
            echo "NODE_ENV=production" >> .env.server

            export REPO_DIR APP_DIR
            export PM2_NAME=indus-erp
            export PROD_SUPABASE_URL PROD_SUPABASE_SERVICE_ROLE_KEY VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
            bash scripts/deploy.sh

            # Public health — API must be up. service_role warns but must not leave production red.
            PUBLIC_HEALTH="$(curl -sf --max-time 15 https://indus-erp.in/api/health || true)"
            echo "==> Public health: ${PUBLIC_HEALTH}"
            echo "${PUBLIC_HEALTH}" | grep -q '"ok":true\|"ok": true' || {
              echo "ERROR: https://indus-erp.in/api/health is not ok"
              exit 1
            }
            if ! echo "${PUBLIC_HEALTH}" | grep -q '"service_role_key":"ok"\|"service_role_key": "ok"'; then
              echo "WARNING: service_role_key is not ok — Raw Attendance Sync may 401 until PROD_SUPABASE_SERVICE_ROLE_KEY is set"
            fi

            # Keep legacy entrypoint in sync for manual runs
            cp scripts/deploy.sh /root/deploy.sh
            chmod +x /root/deploy.sh
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
